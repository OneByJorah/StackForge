[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackforge"
version = "1.0.0"
description = "CPU-only, privacy-focused Docker Compose stack for AI agents — local LLM, vector search, long-term memory, and synced notes, all self-hosted."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["docker", "docker-compose", "ai", "llm", "ollama", "vector-db", "chromadb", "memory", "notes", "self-hosted", "privacy", "cpu-only", "homelab", "ai-stack", "local-ai", "jorathone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Container",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "chromadb>=0.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]
all = ["chromadb", "numpy", "pydantic", "pyyaml", "requests"]

[project.urls]
Homepage = "https://github.com/OneByJorah/StackForge"
Repository = "https://github.com/OneByJorah/StackForge"
Issues = "https://github.com/OneByJorah/StackForge/issues"

[tool.setuptools.packages.find]
include = ["stackforge*"]
